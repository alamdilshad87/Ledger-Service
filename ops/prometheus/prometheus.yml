global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # The app runs either in Compose (app:8080) or on the host (host.docker.internal:8080).
  # Whichever isn't running just shows as down; dashboards sum over both.
  - job_name: ledger-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080", "host.docker.internal:8080"]
