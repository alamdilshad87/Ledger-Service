spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis is only a cache in front of Postgres: give up fast and fall back rather than stall a payment.
      timeout: 250ms
      connect-timeout: 250ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Fail a send within ~5 s so the relay retries on its next tick instead of hanging.
        max.block.ms: 5000
        request.timeout.ms: 4000
        delivery.timeout.ms: 5000
    consumer:
      group-id: webhook-dispatcher
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false   # offsets are committed by the listener container after processing
  task:
    scheduling:
      pool:
        size: 4   # outbox relay, webhook worker, idempotency cleanup, reconciliation

ledger:
  auth:
    # First admin key, registered at startup if set. Create real keys with it, then unset it.
    bootstrap-admin-key: ${LEDGER_ADMIN_API_KEY:}
  idempotency:
    ttl: 24h
    lease: 60s
  outbox:
    topic: ledger-events
    batch-size: 100
    send-timeout: 5s
    relay:
      enabled: true
      interval: PT0.5S
  webhooks:
    max-attempts: 15      # waits 1 s, 2 s, 4 s … 2048 s, then 1 h: about 3 hours of retries before dead-lettering
    base-delay: 1s
    max-delay: 1h
    poll-interval: PT1S
    batch-size: 20
    request-timeout: 5s
    lease: 30s
  reconciliation:
    statement-dir: ${BANK_STATEMENT_DIR:bank-statements}
    zone: Asia/Kolkata
    cron: "0 30 2 * * *"     # 02:30 IST, for the previous day
    fake-bank-enabled: true  # demo endpoint; turn off anywhere a real bank sends statements

server:
  port: 8080

management:
  health:
    redis:
      # Redis is an optional cache; the service is healthy without it.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
